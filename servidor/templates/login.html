{% extends "base.html" %}
{% block titulo %}Painel administrativo · Sentinela{% endblock %}

{% block corpo %}
<main class="login-pagina">
  <header class="login-topo">
    <a class="marca-bloco" href="{{ url_for('landing') }}">
      <span class="marca">Sentinela</span>
      <span class="micro">governança de ia</span>
    </a>
  </header>

  <div class="login-conteudo">
    <section class="login-formulario" aria-labelledby="login-titulo">
      <div class="login-caixa">
        <h1 id="login-titulo" class="login-titulo">Painel administrativo</h1>

        <form method="post" action="{{ url_for('login') }}" class="formulario-login">
          <label class="campo">
            <span class="rotulo">Usuário</span>
            <input type="text" name="usuario" value="{{ usuario or '' }}" autocomplete="username" required autofocus />
          </label>
          <label class="campo">
            <span class="rotulo">Senha</span>
            <input type="password" name="senha" autocomplete="current-password" required />
          </label>

          {% if erro %}
          <p class="mensagem-erro" role="alert">{{ erro }}</p>
          {% endif %}

          <button type="submit" class="botao primario largo">Entrar</button>
        </form>

        <a class="login-voltar" href="{{ url_for('landing') }}">
          <span aria-hidden="true">←</span> Voltar
        </a>
      </div>
    </section>
  </div>
</main>
{% endblock %}

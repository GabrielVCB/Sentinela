<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentinela · Opções</title>
    <script src="tema.js"></script>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body class="opcoes">
    <header class="cabecalho-pagina cabecalho-marca">
      <div class="marca-topo">
        <img class="marca-olhos" src="sentinela-logo.svg?v=5.0.1" alt="" aria-hidden="true" />
        <div>
          <p class="marca">Sentinela</p>
          <p class="config-subtitulo">Configurações da extensão · versão 4.5</p>
        </div>
      </div>
    </header>

    <main class="conteudo-pagina">
      <section class="secao">
        <div class="secao-titulo">
          <div>
            <h2>Conexão</h2>
          </div>
        </div>
        <div class="grade grade-unica">
          <label class="campo">
            <span class="rotulo">Código de conexão <b class="obrigatorio">*</b></span>
            <div class="campo-codigo">
              <input id="token" type="password" autocomplete="off" spellcheck="false" required
                placeholder="Cole o código completo exibido no painel" />
            </div>
          </label>
        </div>
        <div class="acoes-teste">
          <button id="testar" class="botao marca" type="button">Testar conexão</button>
          <div id="resultado-conexao" class="resultado resultado-conexao" role="status" aria-live="polite"></div>
        </div>
      </section>

      <section class="secao">
        <div class="secao-titulo">
          <div>
            <h2>Identificação</h2>
          </div>
        </div>
        <div class="grade">
          <label class="campo">
            <span class="rotulo">Departamento <b class="obrigatorio">*</b></span>
            <select id="departamento" required>
              <option value="" disabled selected>—</option>
            </select>
          </label>
          <label class="campo">
            <span class="rotulo">Identificador do colaborador <b class="obrigatorio">*</b></span>
            <input id="colaborador" type="text" autocomplete="off" required />
          </label>
        </div>
      </section>

      <section class="secao">
        <div class="secao-titulo">
          <div>
            <h2>IAs autorizadas</h2>
          </div>
        </div>

        <ul id="sites-status" class="sites-status" aria-busy="true">
          <li class="sites-carregando" aria-label="Carregando IAs autorizadas"><span class="esqueleto"></span></li>
        </ul>
        <p id="permissao-sites" class="dica"></p>
      </section>

      <section class="secao">
        <div class="secao-titulo">
          <div>
            <h2>Aparência</h2>
          </div>
        </div>
        <div class="linha-opcao">
          <label class="tema-alternador">
            <input id="tema-escuro" type="checkbox" aria-label="Alternar entre tema claro e escuro" />
            <span class="tema-trilho" aria-hidden="true">
              <svg class="tema-icone tema-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.2" />
                <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" />
              </svg>
              <svg class="tema-icone tema-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z" />
              </svg>
              <span class="tema-bolinha"></span>
            </span>
          </label>
        </div>
      </section>

      <section class="secao">
        <div class="secao-titulo">
          <div>
            <h2>Atualização automática</h2>
          </div>
        </div>
        <dl class="resumo" id="resumo">
          <div><dt>Última sincronização</dt><dd id="sincronizacao">nunca</dd><dd id="estado-sincronizacao" class="estado-sincronizacao">Aguardando</dd></div>
          <div><dt>IAs autorizadas</dt><dd id="politica-monitoramento">—</dd></div>
        </dl>
      </section>

      <div class="barra-salvar">
        <div>
          <p id="resultado-salvar" class="resultado" role="status" aria-live="polite"></p>
          <p id="alteracoes-pendentes" class="alteracoes-pendentes" hidden>Alterações não salvas</p>
        </div>
        <button id="salvar" class="botao primario" type="button">Salvar conexão e identificação</button>
      </div>

    </main>

    <script src="config.js"></script>
    <script src="options.js" defer></script>
  </body>
</html>

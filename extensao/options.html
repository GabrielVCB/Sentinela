<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentinela · Opções</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body class="opcoes">
    <header class="cabecalho-pagina">
      <div>
        <p class="marca">Sentinela</p>
        <h1>Configuração da extensão</h1>
        <p class="micro">Extensão versão <strong id="versao-extensao">2.9</strong></p>
      </div>
      <span id="status-ponto" class="ponto-status" aria-hidden="true"></span>
    </header>

    <main class="conteudo-pagina">
      <section class="secao">
        <div class="secao-titulo">
          <div>
            <h2>Conexão</h2>
          </div>
        </div>
        <div class="grade grade-unica">
          <label class="campo">
            <span class="rotulo">Código de verificação <b class="obrigatorio">*</b></span>
            <input id="token" type="text" autocomplete="off" spellcheck="false" required
              placeholder="Cole o código exibido no painel" />
          </label>
        </div>
        <div class="acoes-teste">
          <button id="testar" class="botao" type="button">Testar conexão</button>
          <p id="resultado-conexao" class="resultado" role="status"></p>
        </div>
      </section>

      <section class="secao">
        <div class="secao-titulo">
          <div>
            <h2>Identificação</h2>
          </div>
        </div>
        <div class="grade">
          <label class="campo">
            <span class="rotulo">Departamento <b class="obrigatorio">*</b></span>
            <select id="departamento" required>
              <option value="" disabled selected>Carregando departamentos…</option>
            </select>
          </label>
          <label class="campo">
            <span class="rotulo">Identificador do colaborador <b class="obrigatorio">*</b></span>
            <input id="colaborador" type="text" autocomplete="off" required />
          </label>
        </div>
      </section>

      <section class="secao">
        <div class="secao-titulo">
          <div>
            <h2>IAs monitoradas</h2>
          </div>
        </div>

        <ul id="sites-status" class="sites-status">
          <li class="micro">Carregando IAs…</li>
        </ul>
        <p id="permissao-sites" class="dica"></p>
      </section>

      <section class="secao">
        <div class="secao-titulo">
          <div>
            <h2>Atualização automática</h2>
          </div>
        </div>
        <dl class="resumo" id="resumo">
          <div><dt>Última sincronização</dt><dd id="sincronizacao">nunca</dd></div>
          <div><dt>IAs ativas</dt><dd id="politica-monitoramento">—</dd></div>
        </dl>
      </section>

      <div class="barra-salvar">
        <p id="resultado-salvar" class="resultado" role="status"></p>
        <button id="salvar" class="botao primario" type="button">Salvar configurações</button>
      </div>

    </main>

    <script src="config.js"></script>
    <script src="options.js" defer></script>
  </body>
</html>

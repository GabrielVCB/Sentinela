<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentinela</title>
    <script src="tema.js"></script>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body class="popup">
    <header class="popup-topo">
      <div class="marca-topo">
        <img class="marca-olhos" src="olhos-sentinela.png?v=4.0.6" alt="" aria-hidden="true" />
        <div>
          <p class="marca">Sentinela</p>
          <p class="micro">governança de ia</p>
        </div>
      </div>
      <img id="status-ponto" class="status-olhos off" src="olhos-sentinela.png?v=4.0.6" alt="" />
    </header>

    <section class="bloco">
      <div class="linha">
        <span class="rotulo">Monitoramento</span>
        <span id="monitoramento" class="valor">—</span>
      </div>
      <p id="status-texto" class="micro">Carregando…</p>
    </section>

    <section class="bloco">
      <div class="linha">
        <span class="rotulo">Departamento</span>
        <span id="departamento" class="valor">—</span>
      </div>
      <div class="linha">
        <span class="rotulo">Colaborador</span>
        <span id="colaborador" class="valor">—</span>
      </div>
    </section>

    <section class="bloco">
      <div class="linha">
        <span class="rotulo">Regras ativas</span>
        <span id="regras" class="valor">0</span>
      </div>
      <div class="linha">
        <span class="rotulo">Atualizado automaticamente</span>
        <span id="sincronizacao" class="valor">—</span>
      </div>
    </section>

    <div class="acoes-popup">
      <button id="testar" class="botao marca" type="button">Testar conexão</button>
      <button id="opcoes" class="botao primario" type="button">Opções</button>
    </div>


    <script src="popup.js" defer></script>
  </body>
</html>
